<style>body{margin:0;background:#333;font:13px/1.4 monospace;color:#fff}
#bar{padding:6px 10px;background:#111} b{color:#7fd} .bad{color:#f77;font-weight:700}
#f{display:block;border:0;background:#fff}</style>
<div id="bar">measuring…</div><iframe id="f"></iframe>
<script>
var q=new URLSearchParams(location.search),w=+q.get("w")||390,h=+q.get("h")||1200,src=q.get("src")||"index.html";

f.onload=function(){var win=f.contentWindow,d=win.document.documentElement,o=d.scrollWidth>d.clientWidth;

(o?"<span class='bad'>OVERFLOW +"+(d.scrollWidth-d.clientWidth)+"</span>":"<b>no overflow</b>");};
</script>
