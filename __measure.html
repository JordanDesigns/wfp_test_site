<!doctype html><meta charset="utf-8"><title>image render sizes</title>
<style>body{font:12px monospace;background:#111;color:#eee;padding:6px;margin:0}
iframe{border:0;width:1600px;height:1400px;position:absolute;left:-9999px}</style>
<div id="out">measuring...</div>
<iframe id="f"></iframe>
<script>
var pages = ["/","/about","/caskets-containers","/specialty-caskets","/cypress",
             "/mortuary-storage","/essentials","/veterinarian-pet","/contact"];
var max = {}, f = document.getElementById("f"), i = 0;
function step() {
  if (i >= pages.length) {
    var keys = Object.keys(max).sort();
    document.getElementById("out").innerHTML =
      keys.map(function (k) { return k + "  rendered=" + max[k].w + "  natural=" + max[k].n; }).join("<br>");
    return;
  }
  f.onload = function () {
    setTimeout(function () {
      var imgs = f.contentWindow.document.querySelectorAll("img");
      for (var j = 0; j < imgs.length; j++) {
        var im = imgs[j];
        var src = im.getAttribute("src");
        if (!src || src.indexOf("assets/img") < 0) continue;
        var name = src.split("/").pop();
        var w = Math.round(im.getBoundingClientRect().width);
        if (!max[name] || w > max[name].w) max[name] = { w: w, n: im.naturalWidth };
      }
      i++; step();
    }, 500);
  };
  f.src = pages[i];
}
step();
</script>
